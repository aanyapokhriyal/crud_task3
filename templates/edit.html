<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Edit User Details</title>
</head>

<body>

    <h1>Update User Details</h1>

    <form action="/update/{{ user.id }}" method="post">

        <label for="user_name">Name:</label><br>
        <input type="text" id="user_name" name="user_name" value="{{ user.user_name }}" required><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob" value="{{ user.dob }}" required><br><br>

        <label for="course">Course:</label><br>
        <select id="course" name="course" required>
            <option value="BTech" {% if user.course=="BTech" %}selected{% endif %}> BTech</option>
            <option value="BBA" {% if user.course=="BBA" %}selected{% endif %}> BBA </option>
            <option value="BSc" {% if user.course=="BSc" %}selected{% endif %}>BSc</option>
        </select><br><br>

        <label for="phone">Phone:</label><br>
        <input type="tel" id="phone" name="phone" value="{{ user.phone }}" required><br><br>

        <button type="submit" class="btn">Update User</button>

        <div>
            <br><br><a href="/logout">Logout</a>
            <br><br><a href="/dashboard">Dashboard</a>
        </div>

    </form>

</body>

</html>
